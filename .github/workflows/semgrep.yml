name: Semgrep Security Scan

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto